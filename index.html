<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GameWander · 独立小游戏</title>
  <meta name="description" content="GameWander 的独立小游戏与趣味应用。" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍃</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="./">
        <span class="mark">G</span>
        <span>GameWander</span>
      </a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1 class="zh">小而有趣的独立游戏</h1>
        <h1 class="en">Small, playful indie games</h1>
        <p class="zh">GameWander 出品的一系列轻量小游戏与趣味应用，随开随玩。</p>
        <p class="en">Lightweight games and fun apps by GameWander. Pick one and play.</p>
      </div>
    </section>

    <section class="games">
      <div class="container">
        <h2 class="zh">作品</h2>
        <h2 class="en">Games</h2>

        <a class="game-card" href="./teascore/">
          <span class="icon">🍵</span>
          <span class="meta">
            <h3>TeaScore · 茶度测试</h3>
            <p class="zh">30 道趣味选择题，测测你是哪种茶系人格。</p>
            <p class="en">Answer 30 fun questions and discover your tea personality.</p>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="links">
        <a href="./teascore/support/">技术支持</a>
        <a href="./teascore/privacy/">隐私政策</a>
      </div>
      <div>© 2026 GameWander</div>
    </div>
  </footer>

  <script>
    (function () {
      var en = new URLSearchParams(location.search).get("lang") === "en";
      document.documentElement.lang = en ? "en" : "zh-Hans";
      document.querySelectorAll(en ? ".zh" : ".en").forEach(function (el) {
        el.hidden = true;
      });
    })();
  </script>
</body>
</html>
